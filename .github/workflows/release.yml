name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check tag and manifest versions
        run: node scripts/check-version.mjs
      - run: npm run package
      - run: sha256sum artifacts/*.zip > artifacts/SHA256SUMS.txt
      - name: Publish release with packaged extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.zip artifacts/SHA256SUMS.txt --verify-tag --generate-notes
